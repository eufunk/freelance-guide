name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      # Local Supabase stack for the database and E2E tests. On Linux, Docker
      # runs natively, so the CLI is called directly instead of through WSL.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - run: supabase start
      - run: supabase test db
      - run: cp .env.example .env.local

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # On failure, keep the Playwright traces and screenshots for debugging
      # (download from the run's summary page; open with: npx playwright show-trace <file>).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
