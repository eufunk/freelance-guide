<!doctype html>
<html lang="de">
  <body
    style="
      font-family:
        system-ui,
        -apple-system,
        sans-serif;
      color: #171717;
      line-height: 1.5;
    "
  >
    <h1 style="font-size: 20px">Passwort zurücksetzen</h1>
    <p>Du hast angefordert, dein Passwort für den Freelance Guide zurückzusetzen:</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/passwort-neu"
        style="
          display: inline-block;
          padding: 12px 20px;
          background: #171717;
          color: #ffffff;
          border-radius: 8px;
          text-decoration: none;
        "
        >Neues Passwort festlegen</a
      >
    </p>
    <p style="color: #666666; font-size: 14px">
      Der Link ist eine Stunde gültig. Wenn du das nicht angefordert hast, kannst du diese E-Mail
      ignorieren – dein Passwort bleibt dann unverändert.
    </p>
  </body>
</html>
